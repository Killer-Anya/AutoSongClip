<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="632" viewBox="0 0 1340 632" role="img" aria-labelledby="title description" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <title id="title">从录播到网页曲库</title>
  <desc id="description">输入 B 站录播后获取并校验音轨，转写并定位演唱。逐段识曲、切片、排轴并质检。未通过的候选记录原因。通过的成品打包并经人工审核后发布，其余保留待审核。</desc>
  <rect width="1340" height="632" rx="16" fill="#10151c"/>
  <g id="phase-1">
    <rect x="24" y="16" width="332" height="600" rx="12" fill="#1c242d" stroke="#485562"/>
    <text x="190" y="46" fill="#f0f4f8" font-size="21" font-weight="700" text-anchor="middle">音轨获取与演唱检测</text>
  </g>
  <g id="phase-2">
    <rect x="400" y="16" width="332" height="600" rx="12" fill="#1c242d" stroke="#485562"/>
    <text x="566" y="46" fill="#f0f4f8" font-size="21" font-weight="700" text-anchor="middle">识曲、精切与排轴</text>
  </g>
  <g id="phase-3">
    <rect x="776" y="16" width="540" height="600" rx="12" fill="#1c242d" stroke="#485562"/>
    <text x="1046" y="46" fill="#f0f4f8" font-size="21" font-weight="700" text-anchor="middle">质检、人工审核与发布</text>
  </g>
  <text x="926" y="65" fill="#bdc8d4" font-size="13" font-weight="400" text-anchor="middle">可选 MiMo 音频复核</text>
  <g id="flow-lines">
    <g data-from="start" data-to="source">
      <polyline points="190,170 190,186" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="186,179 190,186 194,179" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="source" data-to="audio">
      <polyline points="190,246 190,266" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="186,259 190,266 194,259" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="audio" data-to="transcribe">
      <polyline points="190,340 190,364" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="186,357 190,364 194,357" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="transcribe" data-to="identify">
      <polyline points="304,408 378,408 378,149 452,149" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="445,145 452,149 445,153" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="identify" data-to="cut">
      <polyline points="566,186 566,219" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="562,212 566,219 570,212" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="cut" data-to="align">
      <polyline points="566,307 566,348" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="562,341 566,348 570,341" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="align" data-to="quality">
      <polyline points="680,399 754,399 754,122 812,122" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="805,118 812,122 805,126" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="quality" data-to="reject-log">
      <polyline points="1040,122 1068,122" fill="none" stroke="#e5a0aa" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="1061,118 1068,122 1061,126" fill="none" stroke="#e5a0aa" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="1054" y="112" fill="#e5a0aa" font-size="13" font-weight="700" text-anchor="middle">否</text>
    </g>
    <g data-from="reject-log" data-to="rejected">
      <polyline points="1182,155 1182,205" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="1178,198 1182,205 1186,198" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="quality" data-to="package">
      <polyline points="926,170 926,197" fill="none" stroke="#a3ccaf" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="922,190 926,197 930,190" fill="none" stroke="#a3ccaf" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="940" y="187" fill="#a3ccaf" font-size="13" font-weight="700" text-anchor="start">是</text>
    </g>
    <g data-from="package" data-to="files">
      <polyline points="926,273 926,289" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="922,282 926,289 930,282" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="files" data-to="review">
      <polyline points="926,343 926,360" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="922,353 926,360 930,353" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="review" data-to="approval">
      <polyline points="926,420 926,438" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="922,431 926,438 930,431" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g data-from="approval" data-to="held">
      <polyline points="926,534 926,553" fill="none" stroke="#e5a0aa" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="922,546 926,553 930,546" fill="none" stroke="#e5a0aa" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="940" y="547" fill="#e5a0aa" font-size="13" font-weight="700" text-anchor="start">否</text>
    </g>
    <g data-from="approval" data-to="publish">
      <polyline points="1040,486 1068,486" fill="none" stroke="#a3ccaf" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="1061,482 1068,486 1061,490" fill="none" stroke="#a3ccaf" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="1054" y="476" fill="#a3ccaf" font-size="13" font-weight="700" text-anchor="middle">是</text>
    </g>
    <g data-from="publish" data-to="published">
      <polyline points="1182,522 1182,553" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="1178,546 1182,553 1186,546" fill="none" stroke="#adb9c6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="start" data-symbol="terminal">
    <rect x="128" y="134" width="124" height="36" rx="18" fill="#deebfa" stroke="#83a9d4" stroke-width="1.4"/>
    <text x="190" y="158" fill="#132f4e" font-size="17" font-weight="700" text-anchor="middle">开始</text>
  </g>
  <g id="source" data-symbol="data">
    <polygon points="90,186 304,186 290,246 76,246" fill="#deebfa" stroke="#83a9d4" stroke-width="1.4"/>
    <text x="190" y="212" fill="#132f4e" font-size="17" font-weight="700" text-anchor="middle">录播链接或 BV 号</text>
    <text x="190" y="233" fill="#284867" font-size="14" font-weight="400" text-anchor="middle">选择分 P</text>
  </g>
  <g id="audio" data-symbol="process">
    <rect x="76" y="266" width="228" height="74" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="190" y="289" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">获取并校验音轨</text>
    <text x="190" y="311" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">选择最高带宽的 DASH 音轨</text>
    <text x="190" y="329" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">双声道 AAC · 44.1 / 48 kHz</text>
  </g>
  <g id="transcribe" data-symbol="process">
    <rect x="76" y="364" width="228" height="88" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="190" y="386" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">转写并定位演唱</text>
    <text x="190" y="408" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">本地 Whisper small</text>
    <text x="190" y="426" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">缓存词级时间戳</text>
    <text x="190" y="444" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">演唱与说话标签覆盖 ≥95%</text>
  </g>
  <g id="identify" data-symbol="process">
    <rect x="452" y="112" width="228" height="74" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="566" y="135" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">识别歌曲</text>
    <text x="566" y="157" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">网易云歌词检索 · 召回 ≥40%</text>
    <text x="566" y="175" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">可计算时 DTW ≥60%</text>
  </g>
  <g id="cut" data-symbol="process">
    <rect x="452" y="219" width="228" height="88" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="566" y="241" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">精调切点</text>
    <text x="566" y="263" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">FFmpeg 流复制</text>
    <text x="566" y="281" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">静音 ≥500 ms · 说话 ≤8%</text>
    <text x="566" y="299" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">时长偏差 ≤0.15 s</text>
  </g>
  <g id="align" data-symbol="process">
    <rect x="452" y="348" width="228" height="102" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="566" y="370" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">对齐并检查歌词</text>
    <text x="566" y="391" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">Whisper 词级时间 + 拼音 DTW</text>
    <text x="566" y="408" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">覆盖 ≥80% · 锚定 ≥85%</text>
    <text x="566" y="425" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">相对 ASR 的中位误差 ≤0.30 s</text>
    <text x="566" y="442" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">P95 ≤0.90 s</text>
  </g>
  <g id="quality" data-symbol="decision">
    <polygon points="926,74 1040,122 926,170 812,122" fill="#fff2d6" stroke="#d5a160" stroke-width="1.4"/>
    <text x="926" y="128" fill="#463112" font-size="17" font-weight="700" text-anchor="middle">候选通过质检？</text>
  </g>
  <g id="reject-log" data-symbol="process">
    <rect x="1068" y="89" width="228" height="66" rx="0" fill="#f9e7ea" stroke="#c47985" stroke-width="1.4"/>
    <text x="1182" y="118" fill="#662d39" font-size="17" font-weight="700" text-anchor="middle">记录拦截原因</text>
    <text x="1182" y="139" fill="#703642" font-size="14" font-weight="400" text-anchor="middle">注明未通过的检查项</text>
  </g>
  <g id="rejected" data-symbol="terminal">
    <rect x="1095" y="205" width="174" height="38" rx="19" fill="#f9e7ea" stroke="#c47985" stroke-width="1.4"/>
    <text x="1182" y="230" fill="#662d39" font-size="17" font-weight="700" text-anchor="middle">拦截当前候选</text>
  </g>
  <g id="package" data-symbol="process">
    <rect x="812" y="197" width="228" height="76" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="926" y="221" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">打包通过质检的歌切</text>
    <text x="926" y="243" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">生成音频、歌词与字幕</text>
    <text x="926" y="261" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">写入待审核曲库索引</text>
  </g>
  <g id="files" data-symbol="data">
    <polygon points="826,289 1040,289 1026,343 812,343" fill="#deebfa" stroke="#83a9d4" stroke-width="1.4"/>
    <text x="926" y="312" fill="#132f4e" font-size="17" font-weight="700" text-anchor="middle">待审核产物</text>
    <text x="926" y="333" fill="#284867" font-size="14" font-weight="400" text-anchor="middle">M4A · LRC · ASS · 曲库条目</text>
  </g>
  <g id="review" data-symbol="manual">
    <polygon points="812,360 1040,360 1025,420 827,420" fill="#e9e5f6" stroke="#a398c5" stroke-width="1.4"/>
    <text x="926" y="386" fill="#35294d" font-size="17" font-weight="700" text-anchor="middle">人工抽听与核对</text>
    <text x="926" y="407" fill="#4f4167" font-size="14" font-weight="400" text-anchor="middle">确认播放及歌词时间轴</text>
  </g>
  <g id="approval" data-symbol="decision">
    <polygon points="926,438 1040,486 926,534 812,486" fill="#fff2d6" stroke="#d5a160" stroke-width="1.4"/>
    <text x="926" y="492" fill="#463112" font-size="17" font-weight="700" text-anchor="middle">同意上架？</text>
  </g>
  <g id="held" data-symbol="terminal">
    <rect x="839" y="553" width="174" height="38" rx="19" fill="#e8edf4" stroke="#8c9aae" stroke-width="1.4"/>
    <text x="926" y="578" fill="#2d4058" font-size="17" font-weight="700" text-anchor="middle">保留待审核</text>
  </g>
  <g id="publish" data-symbol="process">
    <rect x="1068" y="450" width="228" height="72" rx="0" fill="#222931" stroke="#55616e" stroke-width="1.4"/>
    <text x="1182" y="472" fill="#f4f7fb" font-size="17" font-weight="700" text-anchor="middle">发布至网页曲库</text>
    <text x="1182" y="494" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">放置已审核的音频</text>
    <text x="1182" y="512" fill="#c3cdd9" font-size="14" font-weight="400" text-anchor="middle">合并索引并重建网页</text>
  </g>
  <g id="published" data-symbol="terminal">
    <rect x="1095" y="553" width="174" height="38" rx="19" fill="#ddf2e7" stroke="#78a691" stroke-width="1.4"/>
    <text x="1182" y="578" fill="#204837" font-size="17" font-weight="700" text-anchor="middle">发布完成</text>
  </g>
</svg>
