<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0e12">
<title>甜蜜女巫的歌回 · 妮莉安Lily</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;color:#fff;background:#120a0e;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

#bg{position:fixed;inset:-12%;z-index:0;background:url('./cover.jpg') center/cover no-repeat;
  filter:blur(60px) saturate(175%) brightness(.66);transform:scale(1.18)}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.58) 72%, rgba(0,0,0,.8) 100%)}

#player{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:2.2vh 2.2vw}
#pCard{position:relative;width:min(94vw,480px);height:100%;max-height:min(96vh,900px);
  border-radius:30px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(14px,6.4%,30px) clamp(14px,6.4%,30px) 0;
  padding-top:calc(clamp(14px,6.4%,30px) + env(safe-area-inset-top));
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2)}

#pCoverWrap{position:relative;z-index:1;flex:none;margin:0 auto 5%;width:100%;aspect-ratio:1}
#pCover{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22)}
#pCover img{width:100%;height:100%;object-fit:cover;display:block}

#pInfo{position:relative;z-index:3;flex:none;margin-top:0;display:flex;align-items:flex-start;gap:10px}
#pInfo .m{flex:1;min-width:0}
#pTitle{font-size:19.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pMeta{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:6px;
  display:flex;flex-wrap:wrap;gap:4px 10px;line-height:1.5}
#pMeta span{white-space:nowrap}
#mHome{flex-basis:100%;color:rgba(255,255,255,.66);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.28)}
#mHome:hover{color:#ff9dbb;border-bottom-color:#ff9dbb}
#pMore{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);
  display:grid;place-items:center;flex:none;color:rgba(255,255,255,.8)}

#lyrBox{position:relative;z-index:2;flex:1 1 auto;min-height:72px;margin:0 0 clamp(10px,5%,22px)}
/* 条状阴影：中间重、两头细，向外自然过渡 */
#lyrBox::before,#lyrBox::after{content:'';position:absolute;left:0;right:0;height:12px;
  pointer-events:none;z-index:4;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 50%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 50%,transparent 100%)}
/* 上：2px 实线 + 向下渐隐 */
#lyrBox::before{top:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.55) 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,0) 100%)}
/* 下：镜像，2px 实线 + 向上渐隐 */
#lyrBox::after{bottom:0;
  background:linear-gradient(0deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.55) 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,0) 100%)}
#lyrWrap{position:relative;z-index:2;flex:1 1 auto;min-height:0;margin:0;height:100%;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
#lyrWrap::-webkit-scrollbar{display:none}
#lyrInner{padding:50% 0}
.ln{padding:.42vh 2px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.42);
  transition:color .28s;cursor:pointer;word-break:break-word;text-align:center}
.ln.done{color:rgba(255,255,255,.62)}
.ln.active{color:#fff;font-size:20px;font-weight:700;text-shadow:0 2px 16px rgba(0,0,0,.5)}
#noLyr{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:12px}

#pSeekRow{position:relative;z-index:3;flex:none;margin-top:clamp(8px,3.75%,18px);display:flex;align-items:center;gap:10px;
  font-size:11px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
#pSeek{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
#pTrack{position:relative;width:100%;height:2.5px;border-radius:2px;background:rgba(255,255,255,.25)}
#pFill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:2px}
#pKnob{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%) scale(0);transition:transform .15s;pointer-events:none;
  box-shadow:0 1px 5px rgba(0,0,0,.5)}
#pSeek:hover #pKnob,#pSeek.drag #pKnob{transform:translate(-50%,-50%) scale(1)}

#pCtrl{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:clamp(8px,3.75%,18px);margin-bottom:clamp(12px,6.4%,30px);padding-bottom:0}
#pCtrl button{display:grid;place-items:center;opacity:.92}
#pCtrl svg{width:24px;height:24px}
#pPlayBtn{width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.22),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.8)!important;opacity:1!important}
#pPlayBtn svg{width:20px;height:20px}
#modeBtn.on{color:#ff9dbb}

/* ===== 反馈面板 ===== */

/* ===== 播放列表抽屉 ===== */
#drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .3s;display:flex;justify-content:flex-end}
#drawer.show{opacity:1;pointer-events:auto}
#drawerIn{width:min(400px,88vw);height:100%;background:rgba(24,18,22,.92);
  border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.8,.3,1)}
#drawer.show #drawerIn{transform:none}
#drawerHead{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#drawerHead .r1{display:flex;align-items:center;margin-bottom:10px}
#drawerHead h3{font-size:14px;flex:1;font-weight:600}
#drawerClose{font-size:13px;color:rgba(255,255,255,.5)}
#filters{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
#fSearch{flex:1 1 100%}
#fSearch{flex:1 1 auto;min-width:0;height:32px;box-sizing:border-box;
  padding:0 10px;border-radius:9px;font-size:16px;line-height:32px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);
  color:#fff;outline:none}
#fSearch::placeholder{color:rgba(255,255,255,.35)}
select.fSel{flex:1 1 0;min-width:0;height:32px;box-sizing:border-box;
  padding:0 2px;border-radius:9px;font-size:16px;line-height:30px;
  color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);outline:none;
  text-align:center;text-align-last:center;
  appearance:none;-webkit-appearance:none;-moz-appearance:none}
select.fSel option{background:#241a1f;color:#fff;text-align:left}
#plist{flex:1;overflow-y:auto;padding:6px}
.pi{display:flex;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}
.pi:hover{background:rgba(255,255,255,.07)}
.pi.on{background:rgba(255,157,187,.18);color:#ff9dbb}
.pi .n{width:20px;text-align:right;font-size:12px;color:rgba(255,255,255,.35);flex:none}
.pi .m{flex:1;min-width:0}
.pi .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .a{font-size:12px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .d{font-size:11.5px;color:rgba(255,255,255,.35);flex:none}
#pEmpty{text-align:center;color:rgba(255,255,255,.3);font-size:13px;padding:30px 0}

#pRetry{pointer-events:auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  font-size:11px;border-radius:10px;padding:2px 10px;cursor:pointer}
#pStatus{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;z-index:6;font-size:12px;letter-spacing:.03em;
  color:rgba(255,255,255,.62);text-align:center;pointer-events:none}
#pStatus.show{display:flex}
#pStatus .ring{width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);border-top-color:#ff9dbb;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lyrBox.waiting #lyrWrap{opacity:.06}
#lyrWrap{position:relative}

/* Shared toolbar and responsive player layout */
#player{
  overflow:auto;
  display:flex;align-items:stretch;justify-content:stretch;
  padding:max(2.2vh,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
    max(2.2vh,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
#pCard{
  display:grid;width:min(100%,480px);height:100%;min-height:470px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(72px,1fr) auto auto auto;
  grid-template-areas:"cover" "lyrics" "info" "seek" "ctrl";
  max-height:860px;margin:auto;padding:clamp(14px,6.4vw,25px) clamp(14px,6.4vw,25px) 16px;
}
#pHeader{
  grid-area:info;align-self:start;justify-self:end;z-index:5;
  margin-block-start:-7px;margin-inline-end:-8px;
}
#languageToggle{
  display:flex;align-items:center;justify-content:center;min-height:44px;
  gap:5px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap;
  transition:background-color .2s;
}
#languageToggle span{opacity:.65}
#languageToggle [aria-hidden]{opacity:.45}
html[lang="zh-CN"] #languageToggle [lang="zh-CN"],html[lang="en"] #languageToggle [lang="en"]{opacity:1}
#languageToggle:active{background:rgba(255,245,249,.16)}
@media (hover:hover){
  #languageToggle:hover{background:rgba(255,245,249,.16)}
}
#pRecord{display:none}
:where(button,a,select,input,#lyrWrap,#pSeek):focus-visible{
  outline:2px solid #ffc1d8;outline-offset:3px;
}
#pCoverWrap{grid-area:cover;width:min(100%,39vh,350px);width:min(100%,39dvh,350px);margin:0 auto 14px}
#pCover{background:rgba(21,11,17,.4)}
#pInfo{grid-area:info;min-width:0}
#pTitle{margin-inline-end:72px;overflow-wrap:anywhere;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#pMeta{font-size:13px;color:rgba(255,255,255,.79)}
#pMeta span{white-space:normal;overflow-wrap:anywhere}
#mHome{overflow-wrap:anywhere;color:#f7d8e3}
#pSeekRow{grid-area:seek;margin-top:8px;color:rgba(255,255,255,.76)}
#pSeek{touch-action:none}
#pCtrl{grid-area:ctrl;margin:2px 0 0}
#pCtrl button{min-width:44px;min-height:44px;border-radius:10px}
#pCtrl button:hover{background-color:rgba(255,255,255,.09)}
#pCtrl #pPlayBtn{border-radius:50%}
#lyrBox{
  --lyric-anchor:.5;
  grid-area:lyrics;min-width:0;min-height:0;
}
#lyricHeading{
  position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
}
#lyrWrap{
  position:absolute;inset:0;height:auto;
  overscroll-behavior:contain;scroll-behavior:auto;overflow-anchor:none;
}
#lyrInner{
  padding:calc(var(--lyric-viewport,144px) * var(--lyric-anchor)) 0
    calc(var(--lyric-viewport,144px) * (1 - var(--lyric-anchor)));
}
.ln{overflow-wrap:anywhere}
#noLyr{color:rgba(255,240,247,.76);font-size:14px;padding:20px;text-align:center}
#pStatus{color:rgba(255,240,247,.86)}
#fSearch{
  flex:1 0 100%;font-size:16px;min-height:38px;
}
select.fSel{
  flex:1 1 100px;height:36px;font-size:14px;
  padding:0 22px 0 8px;text-align:start;text-align-last:start;
  appearance:auto;
}
#fSearch::placeholder,#drawerClose,.pi .a,.pi .d,.pi .n,#pEmpty{color:rgba(255,255,255,.66)}

@media (min-width:1000px), (min-width:620px) and (max-height:520px) and (orientation:landscape){
  #player{padding:20px 28px}
  #pCard{
    --left-width:min(35vw,46vh,380px);
    --left-width:min(35vw,46dvh,380px);
    width:min(100%,1090px);height:auto;min-height:0;max-height:none;
    grid-template-columns:var(--left-width) minmax(0,1fr);
    grid-template-rows:auto auto auto auto auto;
    grid-template-areas:
      "header header"
      "cover  lyrics"
      "info   lyrics"
      "seek   lyrics"
      "ctrl   lyrics";
    column-gap:clamp(32px,4vw,58px);row-gap:12px;padding:24px 28px;
  }
  #pHeader{grid-area:header;margin:0 0 3px}
  #languageToggle{padding-inline:12px}
  #pCtrl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));justify-items:center}
  #pCoverWrap{width:100%;margin:0}
  #pTitle{margin-inline-end:0;font-size:24px}
  #mHome{flex-basis:auto}
  #pSeekRow,#pCtrl{margin:0}
  #lyrBox{
    --lyric-anchor:.43;
    align-self:stretch;margin:0;
  }
  #lyrBox::before,#lyrBox::after{display:none}
  #lyrWrap{
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 81%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 16%,#000 81%,transparent);
  }
  #lyrInner{padding-inline:4px 18px;font-size:clamp(30px,2.85vw,44px)}
  .ln,.ln.active{font-size:inherit;font-weight:700}
  .ln{
    max-inline-size:21em;margin-inline:auto;padding:.26em 0;line-height:1.3;text-align:center;
    letter-spacing:-.018em;color:rgba(255,243,249,.53);
  }
  .ln.done{color:rgba(255,243,249,.37)}
  .ln.active{color:#fff;font-size:1.35em;text-shadow:0 2px 18px rgba(40,16,26,.24)}
  .ln:hover{color:#fff}
  #drawerIn{width:min(420px,88vw)}
}

@media (min-width:1000px) and (min-height:521px){
  #player{
    --frame-inset:clamp(16px,2.4vw,42px);
    padding:var(--frame-inset);
  }
  #bg{filter:blur(16px) saturate(116%) brightness(.7)}
  #pCard{
    --stage-width:min(100vw - 2 * var(--frame-inset), (100vh - 2 * var(--frame-inset)) * 16 / 9, 1720px);
    --stage-width:min(100vw - 2 * var(--frame-inset), (100dvh - 2 * var(--frame-inset)) * 16 / 9, 1720px);
    --content-inset:clamp(24px,var(--stage-width) * .044,76px);
    --play-size:clamp(48px,var(--stage-width) * .048,76px);
    width:var(--stage-width);aspect-ratio:16/9;padding:var(--content-inset);
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto auto auto;
    grid-template-areas:"cover lyrics" "info lyrics" "seek lyrics" "ctrl lyrics";
    gap:clamp(7px,1.35vh,14px) clamp(32px,5.2vw,108px);
    background:linear-gradient(125deg,rgba(255,230,237,.12),rgba(35,17,26,.2));
    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
  }
  #pHeader{
    grid-area:auto;position:absolute;inset-block-start:calc(var(--content-inset) * .42);
    inset-inline-end:var(--content-inset);margin:0;
  }
  #pCoverWrap{align-self:start;justify-self:start;width:auto;height:100%;max-width:74%}
  #pCover{z-index:1;border-radius:12px}
  #pRecord{
    display:block;position:absolute;inset-block-start:2%;inset-inline-start:36%;
    width:96%;aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:
      conic-gradient(from 44deg,transparent,rgba(255,214,229,.14) 14%,transparent 24%,
        transparent 46%,rgba(255,234,240,.2) 61%,transparent 72%),
      repeating-radial-gradient(circle,#201d22 0 1px,#29262b 1px 2px,#18161a 2px 4px);
    box-shadow:0 0 26px rgba(12,6,10,.58),inset 0 0 0 1px rgba(255,228,238,.18);
    animation:rotate-record 12s linear infinite paused;
  }
  #pRecord::after{
    content:"";position:absolute;inset:35%;border-radius:50%;
    background:radial-gradient(circle,#100d10 0 6%,transparent 7%),
      linear-gradient(rgba(35,12,22,.34),rgba(35,12,22,.34)),url('./cover.jpg') center/cover;
    box-shadow:0 0 0 1px rgba(255,235,242,.18);
  }
  #pCard.is-playing #pRecord{animation-play-state:running}
  #pTitle{font-size:clamp(20px,var(--stage-width) * .017,29px)}
  #pMeta{margin-top:3px}
  #pSeekRow,#pCtrl{width:82%}
  #pCtrl{
    grid-template-columns:minmax(44px,1fr) 44px var(--play-size) 44px minmax(44px,1fr);
    gap:clamp(9px,1.35vw,24px);
  }
  #pCtrl #modeBtn{justify-self:end}
  #pCtrl #plBtn{justify-self:start}
  #pCtrl #pPlayBtn{width:var(--play-size);height:var(--play-size)}
  #pPlayBtn svg{width:clamp(20px,var(--stage-width) * .018,30px);height:auto}
  #lyrBox{
    --lyric-anchor:.48;
    width:calc(100% + clamp(24px,2.9vw,56px));justify-self:end;
    margin-inline-end:clamp(24px,3.6vw,70px);
    margin-block:clamp(26px,var(--stage-width) * .055,95px) clamp(20px,var(--stage-width) * .061,105px);
  }
  #lyrWrap{scrollbar-width:auto}
  #lyrWrap::-webkit-scrollbar{display:block;width:3px}
  #lyrWrap::-webkit-scrollbar-track{background:rgba(255,240,246,.12)}
  #lyrWrap::-webkit-scrollbar-thumb{background:rgba(255,240,246,.56);border-radius:999px}
  #lyrInner{padding-inline:18px;font-size:clamp(19px,var(--stage-width) * .0155,27px)}
  .ln{max-inline-size:none;font-weight:500;letter-spacing:.005em;line-height:1.34;padding:clamp(5px,.55vh,8px) 0}
  .ln.active{font-size:1.55em;font-weight:650}
}
@keyframes rotate-record{to{transform:rotate(1turn)}}

@media (min-width:620px) and (max-height:520px) and (orientation:landscape){
  #player{
    padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
      max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  }
  #pCard{--left-width:min(34vw,270px);gap:6px 16px;padding:10px 14px;border-radius:16px}
  #pHeader{margin-bottom:2px}
  #pCoverWrap{width:min(100%,30vh);width:min(100%,30dvh);border-radius:9px}
  #pTitle{font-size:17px}
  #pMeta{font-size:12px;margin-top:3px;gap:2px 7px}
  #lyrInner{font-size:clamp(18px,3vw,27px);padding-inline:8px}
  .ln{padding-block:.22em}
  #pCtrl #pPlayBtn{width:44px;height:44px}
}

@media (max-width:999px) and (max-height:680px) and (orientation:portrait){
  #pCoverWrap{width:min(100%,32vh);width:min(100%,32dvh);margin-bottom:8px}
  #pCard{padding:10px 13px}
  #pMeta{font-size:12px}
}
@media (max-height:330px) and (orientation:landscape) and (min-width:620px){
  #pCard{grid-template-areas:"header header" "info lyrics" "seek lyrics" "ctrl lyrics";grid-template-rows:auto auto auto auto}
  #pCoverWrap{display:none}
}
@media (prefers-reduced-motion:reduce){
  #drawer,#drawerIn,.ln{transition:none}
  #pRecord{animation:none}
}

</style></head>
<body>
<div id="bg"></div><div id="veil"></div>

<div id="player">
  <div id="pCard">
    <div id="pHeader">
      <button type="button" id="languageToggle" aria-label="切换到英文">
        <span lang="zh-CN">中文</span><span aria-hidden="true">/</span><span lang="en">EN</span>
      </button>
    </div>
    <div id="pCoverWrap">
      <div id="pRecord" aria-hidden="true"></div>
      <div id="pCover"><img src="./cover.jpg" alt="封面"></div>
    </div>

    <div id="pInfo">
      <div class="m">
        <div id="pTitle">高质量歌切集｜妮莉安Lily</div>
        <div id="pMeta">
          <span id="mOrig"></span>

<script>
const SONGS = [];  /* 由 lib/build_site.py 注入 */

const $ = id => document.getElementById(id);
const au = $('au');
const messages = {
  'zh-CN': {

    switchLanguage: 'Switch to Chinese',
    library: 'Library',
    lyrics: 'Lyrics',
    cover: 'Cover art',
    performer: 'Performed by 妮莉安Lily',
    profile: '妮莉安Lily on Bilibili',
    original: 'Original artist: ',
    performanceDate: 'Performance date',
    singingLanguage: 'Singing language',
    close: 'Close',
    search: 'Search title or artist',
    emptyCatalog: 'The library has no songs yet',
    noResults: 'No matching songs',
    chooseTrack: 'Choose a song to begin',
    noLyrics: 'Lyrics are unavailable',
    previous: 'Previous track',
    next: 'Next track',
    play: 'Play',
    pause: 'Pause',
    seek: 'Playback position',
    playbackMode: 'Playback mode: ',
    one: 'Repeat one',
    all: 'Repeat all',
    shuffle: 'Shuffle',
    loading: 'Loading…',
    buffering: 'Buffering…',

    trackLabel: (title, artist) => `${title}, originally by ${artist}`,
  },
};
const englishSongLanguages = {
  '国语': 'Mandarin',
  '粤语': 'Cantonese',
  '英文': 'English',
  '英语': 'English',
  '日语': 'Japanese',
  '韩语': 'Korean',
};
const languageStorageKey = 'songcut.interfaceLanguage';
let uiLanguage = 'zh-CN';
try {
  if (localStorage.getItem(languageStorageKey) === 'en') uiLanguage = 'en';
} catch {
  // The language selector also works when storage is unavailable.
}
const t = key => messages[uiLanguage][key];
function songLanguageLabel(value) {
  return uiLanguage === 'en' ? englishSongLanguages[value] ?? value : value;
}
function versionLabel(value) {
  const number = /^第(\d+)次$/.exec(value || '');
  return uiLanguage === 'en' && number ? `Performance ${number[1]}` : value;
}
function setControlLabel(element, label) {
  element.title = label;
  element.setAttribute('aria-label', label);
}
function updateTrackInfo() {
  const song = SONGS[cur];
  $('pTitle').textContent = song ? song.title : t('collection');
  $('mOrig').textContent = song?.artist ? t('original') + song.artist : '';
  const date = song?.date ? song.date + (song.time ? ` (${song.time})` : '') : '';
  $('mTime').textContent = date ? t('performanceDate') + (uiLanguage === 'en' ? ': ' : '：') + date : '';
}
function updatePlayLabel() {
  setControlLabel($('pPlayBtn'), t(au.paused ? 'play' : 'pause'));
}
function applyLanguage() {
  document.documentElement.lang = uiLanguage;
  document.title = t('pageTitle');
  setControlLabel($('languageToggle'), t('switchLanguage'));
  document.querySelectorAll('[data-copy]').forEach(element => {
    element.textContent = t(element.dataset.copy);
  });
  document.querySelectorAll('[data-control]').forEach(element => {
    setControlLabel(element, t(element.dataset.control));
  });
  document.querySelector('#pCover img').alt = t('cover');
  $('pSeek').setAttribute('aria-label', t('seek'));
  const search = $('fSearch');
  search.placeholder = t('search');
  search.setAttribute('aria-label', t('search'));
  const songLanguage = $('fLang');
  songLanguage.setAttribute('aria-label', t('singingLanguage'));
  Array.from(songLanguage.options).forEach(option => {
    option.textContent = option.value ? songLanguageLabel(option.value) : t('singingLanguage');
  });
  const date = $('fDate');
  date.setAttribute('aria-label', t('performanceDate'));
  date.options[0].textContent = t('performanceDate');
  updateTrackInfo();
  updatePlayLabel();
  applyMode();
  refreshStatus();
  const lyricMessage = $('noLyr');
  if (lyricMessage) lyricMessage.textContent = t(cur < 0 ? 'chooseTrack' : 'noLyrics');
  const list = $('plist');
  const top = list.scrollTop;
  const focusedTrack = document.activeElement?.dataset.songIndex;
  renderList();
  if (focusedTrack !== undefined) {
    list.querySelector(`[data-song-index="${focusedTrack}"]`)?.focus({preventScroll: true});
  }
  list.scrollTop = top;
}

let cur=-1, lines=[], els=[], activeIdx=-1, follow=true, followDirty=false;
let lastT=0,lastWall=0,estT=0,dragging=false;
let mode = 'one';                 // one | all | shuffle

const fmt = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function updateSeekValues(duration) {
  const seek = $('pSeek');
  const max = String(Number.isFinite(duration) ? Math.ceil(duration) : 0);
  const value = String(Math.min(Number(max), Math.round(au.currentTime)));
  if (seek.getAttribute('aria-valuemax') !== max) seek.setAttribute('aria-valuemax', max);
  if (seek.getAttribute('aria-valuenow') !== value) {
    seek.setAttribute('aria-valuenow', value);
    seek.setAttribute('aria-valuetext', fmt(au.currentTime));
  }
}
function smoothTime(){
  const t=au.currentTime,w=performance.now();
  if(!au.paused){ if(t!==lastT){lastT=t;lastWall=w;estT=t;} else estT=Math.min(t+(w-lastWall)/1000,t+0.35); }
  else { lastT=t; lastWall=w; estT=t; }
  return estT;
}

/* ---------- 播放列表 + 筛选 ---------- */
function fillSelects(){
  const langs=[...new Set(SONGS.map(s=>s.lang))].filter(Boolean);
  langs.forEach(v=> $('fLang').add(new Option(v, v)));
  const key=d=>{ const m=String(d).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    return m? Number(m[1])*10000+Number(m[2])*100+Number(m[3]) : 0; };
  const dates=[...new Set(SONGS.map(s=>s.date).filter(Boolean))].sort((a,b)=>key(b)-key(a));
  dates.forEach(v=> $('fDate').add(new Option(v, v)));
}

function updateListActive(){
  const box=$('plist'); if(!box) return;
  const items=box.querySelectorAll('.pi');
  items.forEach(el=>{
    const active = Number(el.dataset.songIndex) === cur;
    el.classList.toggle('on', active);
    el.setAttribute('aria-current', String(active));
  });
}
function renderList(){
  const q=$('fSearch').value.trim().toLowerCase();
  const lg=$('fLang').value, dt=$('fDate').value;

  const box=$('plist'); box.innerHTML='';
  viewIdx = [];
  let n=0;
  SONGS.forEach((s,i)=>{
    if(s.legacy) return;
    if(lg && s.lang!==lg) return;
    if(dt && s.date!==dt) return;
    viewIdx.push(i);
    if(q){
      const norm=x=>String(x||'').toLowerCase().replace(/\s+/g,'');
      const hay=norm(s.title+s.artist);
      const ok=q.split(/\s+/).filter(Boolean).every(w=>hay.includes(norm(w)));
      if(!ok) return;
    }
    n++;
    const d=document.createElement('button');
    d.type='button';
    d.className='pi'+(i===cur?' on':'');
    d.dataset.songIndex = i;
    d.setAttribute('aria-current', String(i === cur));
    d.setAttribute('aria-label', s.artist ? t('trackLabel')(s.title, s.artist) : s.title);
    d.innerHTML='<div class="n"></div><div class="m"><div class="t"></div><div class="a"></div></div><div class="d"></div>';
    d.querySelector('.n').textContent=i+1;
    d.querySelector('.t').textContent=s.title;
    d.querySelector('.a').textContent = [
      s.artist && t('original') + s.artist,
      s.lang && songLanguageLabel(s.lang),
      s.date,
      versionLabel(s.ver),
    ].filter(Boolean).join(' · ');
    d.querySelector('.d').textContent=fmt(s.dur);
    d.onclick=()=>{ if(i===cur){ togglePlay(); } else { play(i); } };
    d.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation();
      if(i===cur){ togglePlay(); } else { play(i); } } };
    box.appendChild(d);
  });
  if(!n) {
    const empty = document.createElement('div');
    empty.id = 'pEmpty';
    empty.textContent = t(SONGS.some(song => !song.legacy) ? 'noResults' : 'emptyCatalog');
    box.appendChild(empty);
  }
  const total = SONGS.filter(song => !song.legacy).length;
  $('plTitle').textContent = `${t('library')} · ${n} / ${total}`;
}

/* ---------- 歌词 ---------- */
function parseLRC(txt){
  const out=[];
  (txt||'').split('\n').forEach(ln=>{
    const m=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text=ln.replace(/\[[^\]]*\]/g,'').trim();
    if(!m.length||!text)return;
    m.forEach(x=>out.push({t:+x[1]*60+parseFloat(x[2]),text}));
  });
  return out.sort((a,b)=>a.t-b.t);
}
function buildLyrics(s){
  const inner=$('lyrInner'); inner.innerHTML=''; els=[]; activeIdx=-1; followDirty=false;
  lines=parseLRC(s.lrc); $('lyrWrap').scrollTop=0;
  if(!lines.length){
    const empty = document.createElement('div');
    empty.id = 'noLyr';
    empty.textContent = t('noLyrics');
    inner.appendChild(empty);
    return;
  }
  // 同一时间点的多行歌词合并显示，避免只显示最后一行
  const merged=[];
  lines.forEach(l=>{
    const last=merged[merged.length-1];
    if(last && Math.abs(last.t-l.t)<0.06){ last.text=last.text+'　'+l.text; }
    else merged.push({t:l.t,text:l.text});
  });
  lines=merged;
  lines.forEach((l)=>{
    const d=document.createElement('div'); d.className='ln'; d.textContent=l.text;
    d.onclick=(ev)=>{ ev.stopPropagation();
      const t=Math.max(0,Math.min((au.duration||1e9),l.t));
      au.currentTime=t; if(!au.paused){ au.play().catch(()=>{}); }
      lastT=t; lastWall=performance.now(); estT=t;
    };
    inner.appendChild(d); els.push(d);
  });
  requestAnimationFrame(()=>centerOn(0,false));
}
function centerOn(i,smooth){
  if(i<0||!els[i])return;
  const w=$('lyrWrap'), el=els[i];
  const anchor = Number(getComputedStyle($('lyrBox')).getPropertyValue('--lyric-anchor')) || .5;
  const y = el.offsetTop + el.offsetHeight / 2 - w.clientHeight * anchor;
  smooth = smooth && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(smooth&&w.scrollTo) w.scrollTo({top:y,behavior:'smooth'}); else w.scrollTop=y;
  lastCenter=performance.now();
}

/* ---------- 主循环 ---------- */
function tick(){
  updateSeekValues(au.duration);
  if(scrubbing){ const d0=au.duration||0, q=d0?au.currentTime/d0:0;
    $('pFill').style.width=(q*100)+'%'; $('pKnob').style.left=(q*100)+'%';
    $('pCur').textContent=fmt(au.currentTime);
    requestAnimationFrame(tick); return; }
  const t=smoothTime();
  let idx=-1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t<=t) idx=i; else break; }
  if(idx!==activeIdx){
    if(activeIdx>=0&&els[activeIdx]){
      els[activeIdx].classList.remove('active');
      if(activeIdx<idx) els[activeIdx].classList.add('done');
    }
    activeIdx=idx;
    if(idx>=0&&els[idx]){ els[idx].classList.remove('done'); els[idx].classList.add('active'); followDirty=true; }
  }
  if(follow&&followDirty){ centerOn(activeIdx,true); followDirty=false; }

  const d=au.duration||0, p=d?au.currentTime/d:0;
  $('pFill').style.width=(p*100)+'%'; $('pKnob').style.left=(p*100)+'%';
  $('pCur').textContent=fmt(au.currentTime);
  requestAnimationFrame(tick);
}

/* ---------- 切歌（随机/循环统一） ---------- */
let hist=[];
function viewList(){ return viewIdx.length ? viewIdx : SONGS.map((_,i)=>i); }
function nextSong(auto){
  const V=viewList();
  if(mode==='shuffle' && V.length>1){
    let n=cur; while(n===cur) n=V[Math.floor(Math.random()*V.length)];
    if(cur>=0) hist.push(cur);
    play(n); return;
  }
  const k=V.indexOf(cur);
  play(V[(k<0?0:k+1)%V.length]);
}
function prevSong(){
  const V=viewList();
  if(mode==='shuffle' && hist.length){
    const p=hist.pop();
    if(Number.isInteger(p) && p>=0 && p<SONGS.length){ play(p); return; }
  }
  const k=V.indexOf(cur);
  play(V[(k<=0?V.length-1:k-1)]);
}
/* ---------- 歌词状态重建（跳转后不残留旧高亮） ---------- */
function rebuildLyricState(){
  els.forEach(el=>{ el.classList.remove('active'); el.classList.remove('done'); });
  const t=au.currentTime; let idx=-1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t<=t) idx=i; else break; }
  for(let i=0;i<idx;i++) if(els[i]) els[i].classList.add('done');
  if(idx>=0&&els[idx]) els[idx].classList.add('active');
  activeIdx=idx;
  centerOn(idx,false);
}
/* ---------- 抽屉/弹窗开关（含焦点管理） ---------- */
let drawerOpener = null;
const playlistButton = $('plBtn');
function openDrawer(event){
  const drawer = $('drawer');
  if (drawer.classList.contains('show')) return;
  drawerOpener = event?.currentTarget ?? document.activeElement;
  drawer.classList.add('show');
  drawer.removeAttribute('inert');
  playlistButton.setAttribute('aria-expanded', 'true');
  const activeTrack = document.querySelector('#plist .pi.on');
  if (activeTrack) activeTrack.scrollIntoView({block: 'center'});
  $('drawerClose').focus({preventScroll: true});
}
function closeDrawer(){
  const drawer = $('drawer');
  const hadFocus = drawer.contains(document.activeElement);
  drawer.classList.remove('show');
  drawer.setAttribute('inert', '');
  playlistButton.setAttribute('aria-expanded', 'false');
  if (hadFocus) {
    const opener = drawerOpener?.getClientRects().length ? drawerOpener : playlistButton;
    opener.focus({preventScroll: true});
  }
  drawerOpener = null;
}

/* ---------- 播放 ---------- */
let curSrc=''; let playSeq=0;
let statusKey = '';
let statusTimer;
const playerCard = $('pCard');
function refreshStatus(){
  const text = statusKey === 'modeChanged' ? t('playbackMode') + t(mode) : t(statusKey);
  $('pStatusText').textContent = text ?? '';
  $('pStatusRing').hidden = statusKey !== 'loading' && statusKey !== 'buffering';
  $('pRetry').hidden = statusKey !== 'loadFailed';
  $('pStatus').classList.toggle('show', Boolean(statusKey));
  $('lyrBox').classList.toggle('waiting', Boolean(statusKey));
}
function setStatus(key, duration){
  clearTimeout(statusTimer);
  statusKey = key;
  refreshStatus();
  if (duration) statusTimer = setTimeout(() => setStatus(''), duration);
}
$('pRetry').onclick = () => {
  if (cur < 0) return;
  const position = au.currentTime || 0;
  play(cur);
  const retrySequence = playSeq;
  au.addEventListener('loadedmetadata', () => {
    if (playSeq === retrySequence && position > 0) au.currentTime = position;
  }, {once: true});
};
function play(i){
  if(!Number.isInteger(i)||i<0||i>=SONGS.length) return;   // 非法索引直接忽略
  const seq=++playSeq;
  cur=i; const s=SONGS[i];
  const u='../audio/'+encodeURIComponent(s.file);
  curSrc=u;
  playerCard.classList.remove('is-playing');
  setStatus('loading');
  au.src=u; au.load();
  au.play().catch(err=>{
    if(seq!==playSeq) return;                            // 已被新的一次播放取代，忽略
    if(err && err.name==='NotAllowedError'){ setStatus('readyToPlay'); }
    else if(err && err.name!=='AbortError'){ setStatus('loadFailed'); }
    console.warn('Audio playback failed', err);
  });
  updateTrackInfo();
  $('pTot').textContent=fmt(s.dur);
  au.onloadedmetadata=()=>{ if(isFinite(au.duration)&&au.duration>0) $('pTot').textContent=fmt(au.duration); };
  updateListActive();
  buildLyrics(s); follow=true;
  if(window.matchMedia('(max-width:520px)').matches) closeDrawer();
}
function togglePlay(){
  if(cur<0){ setStatus('chooseTrack',1200); openDrawer(); return; }
  if(!au.src){ play(cur<0?0:cur); return; }
  au.paused?au.play().catch(()=>{}):au.pause();
}
// 进度条拖动跳转（拖动期间冻结歌词跟随，避免 smooth 滚动互相打架）
var lastCenter=0;
var scrubbing=false, wasPlaying=false;
let viewIdx=[];           // 当前筛选后的索引序列
(function(){
  const seek=$('pSeek');
  if(!seek) return;
  const pos=(e)=>{ const r=seek.getBoundingClientRect();
    const cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
    const d=au.duration||0;
    return d? Math.max(0,Math.min(d,(cx-r.left)/r.width*d)) : 0; };
  const begin=(e)=>{ scrubbing=true; wasPlaying=!au.paused; seek.classList.add('drag');
    const t=pos(e); au.currentTime=t; lastT=t; lastWall=performance.now(); estT=t;
    if(e.cancelable) e.preventDefault(); };
  let rafId=0, pendingT=0;
  const move=(e)=>{ if(!scrubbing) return; pendingT=pos(e);
    lastT=pendingT; lastWall=performance.now(); estT=pendingT;
    if(!rafId) rafId=requestAnimationFrame(()=>{ rafId=0; try{ au.currentTime=pendingT; }catch(err){} });
    if(e.cancelable) e.preventDefault(); };
  const endDrag=()=>{ if(!scrubbing) return;
    scrubbing=false; seek.classList.remove('drag');
    followDirty=true; centerOn(activeIdx,false);
    if(wasPlaying) au.play().catch(()=>{}); };
  seek.addEventListener('pointerdown',begin);
  seek.addEventListener('touchstart',begin,{passive:false});
  seek.addEventListener('keydown', e => {
    const offsets = {ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5};
    if (!(e.key in offsets) && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    e.stopPropagation();
    if (!Number.isFinite(au.duration)) return;
    if (e.key === 'Home') au.currentTime = 0;
    else if (e.key === 'End') au.currentTime = au.duration;
    else au.currentTime = Math.max(0, Math.min(au.duration, au.currentTime + offsets[e.key]));
  });
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('touchmove',move,{passive:false});
  ['pointerup','pointercancel','touchend','touchcancel'].forEach(k=>window.addEventListener(k,endDrag));
})();
$('pPlayBtn').onclick=togglePlay;
$('next').onclick=()=>nextSong();
$('prev').onclick=()=>prevSong();

/* ---------- 播放模式循环 ---------- */
const MODES=['one','all','shuffle'];
function applyMode(){
  setControlLabel($('modeBtn'), t('playbackMode') + t(mode));
  $('icoOne').style.display  = mode==='one'?'block':'none';
  $('icoAll').style.display  = mode==='all'?'block':'none';
  $('icoShuf').style.display = mode==='shuffle'?'block':'none';
  $('modeBtn').classList.toggle('on', mode!=='all');
}
$('modeBtn').onclick=()=>{
  const idx=MODES.indexOf(mode);
  mode=MODES[(idx+1)%MODES.length];
  applyMode();
  setStatus('modeChanged',900);
};

/* ---------- 反馈 ---------- */
playlistButton.onclick=openDrawer;
$('drawerClose').onclick=closeDrawer;
$('drawer').onclick=e=>{ if(e.target.id==='drawer') closeDrawer(); };
function setInterfaceLanguage(value) {
  uiLanguage = value;
  try {
    localStorage.setItem(languageStorageKey, uiLanguage);
  } catch {
    // Storage is optional for the current page.
  }
  applyLanguage();
}
$('languageToggle').onclick = () => setInterfaceLanguage(uiLanguage === 'en' ? 'zh-CN' : 'en');




/* 歌词手动滚动 */
let mTimer=null, touchIdle=null;
function pauseFollow(){
  follow=false;
  clearTimeout(mTimer);
}
function scheduleSnapBack(){
  clearTimeout(touchIdle);
  touchIdle=setTimeout(()=>{          // 松手后 1.5 秒无操作 → 平滑回归当前行
    follow=true; followDirty=true;
  },1500);
}
$('lyrWrap').addEventListener('wheel', () => {
  pauseFollow();
  scheduleSnapBack();
}, {passive:true});
$('lyrWrap').addEventListener('keydown', event => {
  if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(event.key)) {
    pauseFollow();
    scheduleSnapBack();
  }
});
['touchstart','touchmove','pointerdown','pointermove'].forEach(k=>
  $('lyrWrap').addEventListener(k,(e)=>{
    if(k==='pointerdown'||k==='pointermove'){ if(window.matchMedia('(pointer:coarse)').matches===false) return; }
    pauseFollow(); scheduleSnapBack();
  },{passive:true}));
['touchend','touchcancel','pointerup','pointercancel'].forEach(k=>
  $('lyrWrap').addEventListener(k,()=>{ scheduleSnapBack(); },{passive:true}));

/* 音频事件 */
au.addEventListener('play',()=>{ $('iPlay').style.display='none'; $('iPause').style.display='block'; updatePlayLabel(); });
au.addEventListener('pause',()=>{ $('iPlay').style.display='block'; $('iPause').style.display='none'; updatePlayLabel(); });
au.addEventListener('ended',()=>{
  if(mode==='one'){ au.currentTime=0; au.play().catch(()=>{}); return; }
  nextSong(true);
});
au.addEventListener('seeked',()=>{ rebuildLyricState(); followDirty=true; });
au.addEventListener('waiting',()=>setStatus('buffering'));
au.addEventListener('playing', () => {
  playerCard.classList.add('is-playing');
  setStatus('');
});
for (const event of ['pause', 'waiting', 'ended', 'error', 'emptied']) {
  au.addEventListener(event, () => playerCard.classList.remove('is-playing'));
}
au.addEventListener('canplay',()=>setStatus(''));
au.addEventListener('error',()=>setStatus('loadFailed'));

/* 筛选事件 */
$('fSearch').oninput=renderList;
$('fSearch').addEventListener('pointerdown',e=>e.stopPropagation());
$('fSearch').addEventListener('click',e=>{ e.stopPropagation(); $('fSearch').focus(); });
$('fLang').onchange=renderList;
$('fDate').onchange=renderList;

function inEditable(t){
  if(!t) return false;
  const tag=(t.tagName||'').toLowerCase();
  return tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable===true;
}
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229) return;          // 输入法组合中
  const drawer=$('drawer');
  if(e.code==='Escape' && drawer.classList.contains('show')){ closeDrawer(); return; }
  if(inEditable(e.target)) return;                    // 输入控件内不抢按键
  if(drawer.classList.contains('show') && (e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='Enter')){
    const items=[...document.querySelectorAll('#plist .pi')];
    if(items.length){
      const idx=items.indexOf(document.activeElement);
      if(e.code==='Enter' && idx>=0){ e.preventDefault(); items[idx].click(); return; }
      if(e.code==='ArrowDown'||e.code==='ArrowUp'){
        e.preventDefault();
        let n=idx<0?0:idx+(e.code==='ArrowDown'?1:-1);
        n=Math.max(0,Math.min(items.length-1,n));
        items[n].focus(); items[n].scrollIntoView({block:'nearest'});
        return;
      }
    }
  }
  if(e.code==='Escape'){ closeDrawer(); return; }
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(e.code==='Space' && (tag==='button'||tag==='a'||e.target.closest&&e.target.closest('button,a'))) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); nextSong(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); prevSong(); }
});
const lyricViewport = $('lyrWrap');
function sizeLyrics() {
  lyricViewport.style.setProperty('--lyric-viewport', `${lyricViewport.clientHeight}px`);
  if (follow && els.length) centerOn(Math.max(0, activeIdx), false);
}
new ResizeObserver(sizeLyrics).observe(lyricViewport);
sizeLyrics();

closeDrawer();
fillSelects();
applyLanguage();
requestAnimationFrame(tick);
</script></body></html>
