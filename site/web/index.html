<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0e12">
<title>甜蜜女巫的歌回 · 妮莉安Lily</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;color:#fff;background:#120a0e;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

#bg{position:fixed;inset:-12%;z-index:0;background:url('./cover.jpg') center/cover no-repeat;
  filter:blur(60px) saturate(175%) brightness(.66);transform:scale(1.18)}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.58) 72%, rgba(0,0,0,.8) 100%)}

#player{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:2.2vh 2.2vw}
#pCard{position:relative;width:min(94vw,480px);height:100%;max-height:min(96vh,900px);
  border-radius:30px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(14px,6.4%,30px) clamp(14px,6.4%,30px) 0;
  padding-top:calc(clamp(14px,6.4%,30px) + env(safe-area-inset-top));
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2)}

#pCoverWrap{position:relative;z-index:1;flex:none;margin:0 auto 5%;width:100%;aspect-ratio:1}
#pCover{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22)}
#pCover img{width:100%;height:100%;object-fit:cover;display:block}

#pInfo{position:relative;z-index:3;flex:none;margin-top:0;display:flex;align-items:flex-start;gap:10px}
#pInfo .m{flex:1;min-width:0}
#pTitle{font-size:19.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pMeta{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:6px;
  display:flex;flex-wrap:wrap;gap:4px 10px;line-height:1.5}
#pMeta span{white-space:nowrap}
#sig{position:absolute;right:9px;bottom:7px;z-index:5;font-size:10px;letter-spacing:.06em;
  color:rgba(255,255,255,.55);user-select:none;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.6)}
#mHome{flex-basis:100%;color:rgba(255,255,255,.66);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.28)}
#mHome:hover{color:#ff9dbb;border-bottom-color:#ff9dbb}
#pMore{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);
  display:grid;place-items:center;flex:none;color:rgba(255,255,255,.8)}

#lyrBox{position:relative;z-index:2;flex:1 1 auto;min-height:72px;margin:0 0 clamp(10px,5%,22px)}
/* 条状阴影：中间重、两头细，向外自然过渡 */
#lyrBox::before,#lyrBox::after{content:'';position:absolute;left:0;right:0;height:12px;
  pointer-events:none;z-index:4;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 50%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 50%,transparent 100%)}
/* 上：2px 实线 + 向下渐隐 */
#lyrBox::before{top:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.55) 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,0) 100%)}
/* 下：镜像，2px 实线 + 向上渐隐 */
#lyrBox::after{bottom:0;
  background:linear-gradient(0deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.55) 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,0) 100%)}
#lyrWrap{position:relative;z-index:2;flex:1 1 auto;min-height:0;margin:0;height:100%;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
#lyrWrap::-webkit-scrollbar{display:none}
#lyrInner{padding:50% 0}
.ln{padding:.42vh 2px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.42);
  transition:color .28s,font-size .28s;cursor:pointer;word-break:break-word;text-align:center}
.ln.done{color:rgba(255,255,255,.62)}
.ln.active{color:#fff;font-size:20px;font-weight:700;text-shadow:0 2px 16px rgba(0,0,0,.5)}
#noLyr{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:12px}

#pSeekRow{position:relative;z-index:3;flex:none;margin-top:clamp(8px,3.75%,18px);display:flex;align-items:center;gap:10px;
  font-size:11px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
#pSeek{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
#pTrack{position:relative;width:100%;height:2.5px;border-radius:2px;background:rgba(255,255,255,.25)}
#pFill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:2px}
#pKnob{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%) scale(0);transition:transform .15s;pointer-events:none;
  box-shadow:0 1px 5px rgba(0,0,0,.5)}
#pSeek:hover #pKnob,#pSeek.drag #pKnob{transform:translate(-50%,-50%) scale(1)}

#pCtrl{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:clamp(8px,3.75%,18px);margin-bottom:clamp(12px,6.4%,30px);padding-bottom:0}
#pCtrl button{display:grid;place-items:center;opacity:.92}
#pCtrl svg{width:24px;height:24px}
#pPlayBtn{width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.22),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.8)!important;opacity:1!important}
#pPlayBtn svg{width:20px;height:20px}
#modeBtn.on{color:#ff9dbb}

/* ===== 反馈面板 ===== */

/* ===== 播放列表抽屉 ===== */
#drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .3s;display:flex;justify-content:flex-end}
#drawer.show{opacity:1;pointer-events:auto}
#drawerIn{width:min(400px,88vw);height:100%;background:rgba(24,18,22,.92);
  border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.8,.3,1)}
#drawer.show #drawerIn{transform:none}
#drawerHead{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#drawerHead .r1{display:flex;align-items:center;margin-bottom:10px}
#drawerHead h3{font-size:14px;flex:1;font-weight:600}
#drawerClose{font-size:13px;color:rgba(255,255,255,.5)}
#filters{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
#fSearch{flex:1 1 100%}
#fSearch{flex:1 1 auto;min-width:0;height:32px;box-sizing:border-box;
  padding:0 10px;border-radius:9px;font-size:16px;line-height:32px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);
  color:#fff;outline:none}
#fSearch::placeholder{color:rgba(255,255,255,.35)}
select.fSel{flex:1 1 0;min-width:0;height:32px;box-sizing:border-box;
  padding:0 2px;border-radius:9px;font-size:16px;line-height:30px;
  color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);outline:none;
  text-align:center;text-align-last:center;
  appearance:none;-webkit-appearance:none;-moz-appearance:none}
select.fSel option{background:#241a1f;color:#fff;text-align:left}
#plist{flex:1;overflow-y:auto;padding:6px}
.pi{display:flex;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}
.pi:hover{background:rgba(255,255,255,.07)}
.pi.on{background:rgba(255,157,187,.18);color:#ff9dbb}
.pi .n{width:20px;text-align:right;font-size:12px;color:rgba(255,255,255,.35);flex:none}
.pi .m{flex:1;min-width:0}
.pi .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .a{font-size:12px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .d{font-size:11.5px;color:rgba(255,255,255,.35);flex:none}
#pEmpty{text-align:center;color:rgba(255,255,255,.3);font-size:13px;padding:30px 0}

/* ---- 短屏/横屏自适应（修复 844x390 控件不可见） ---- */
@media (max-height:520px) and (orientation:landscape){
  body{overflow:auto}
  #pCard{max-height:none;height:auto;display:grid;grid-template-columns:38% 1fr;
    grid-template-areas:"cover info" "cover lyrics" "seek seek" "ctrl ctrl";
    column-gap:14px;padding:12px;border-radius:18px}
  #pCoverWrap{grid-area:cover;height:auto;max-height:34vh}
  #pCover{height:100%}
  #pInfo{grid-area:info}
  #lyrWrap{grid-area:lyrics;min-height:22vh;max-height:26vh}
  #pSeekRow{grid-area:seek}
  #pCtrl{grid-area:ctrl}
}
@media (max-height:420px){
  #pCoverWrap{display:none}
  #lyrWrap{min-height:28vh}
}
#pRetry{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  font-size:11px;border-radius:10px;padding:2px 10px;cursor:pointer}
#pStatus{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;z-index:6;font-size:12px;letter-spacing:.03em;
  color:rgba(255,255,255,.62);text-align:center;pointer-events:none}
#pStatus.show{display:flex}
#pStatus .ring{width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);border-top-color:#ff9dbb;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lyrBox.waiting #lyrWrap{opacity:.06}
#lyrWrap{position:relative}
</style></head>
<body>
<div id="bg"></div><div id="veil"></div>

<div id="player">
  <div id="pCard">
    <div id="pCoverWrap"><div id="pCover"><img src="./cover.jpg" alt="cover"><span id="sig">Design by Shawn</span></div></div>

    <div id="lyrBox">
    <div id="lyrWrap"><div id="lyrInner"><div id="noLyr">请选择一首歌开始</div></div>
</div>
      <div id="pStatus"></div>
    </div>


    <div id="pInfo">
      <div class="m">
        <div id="pTitle">高质量歌切集｜妮莉安Lily</div>
        <div id="pMeta">
          <span id="mOrig"></span>
          <span id="mCover">cover：妮莉安Lily</span>
          <span id="mTime"></span>
          <a id="mHome" href="https://space.bilibili.com/3493271057730096" target="_blank" rel="noopener">妮妮主页：space.bilibili.com/3493271057730096</a>
        </div>
      </div>
    </div>

    <div id="pSeekRow">
      <span id="pCur">0:00</span>
      <div id="pSeek"><div id="pTrack"><div id="pFill"></div></div><div id="pKnob"></div></div>
      <span id="pTot">0:00</span>
    </div>

    <div id="pCtrl">
      <button id="modeBtn" title="播放模式：单曲循环">
        <svg id="icoOne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          <text x="12" y="15.5" font-size="8" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">1</text>
        </svg>
        <svg id="icoAll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
          <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <svg id="icoShuf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
          <path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>
        </svg>
      </button>
      <button id="prev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="pPlayBtn" title="播放/暂停">
        <svg id="iPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
        <svg id="iPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
      </button>
      <button id="next" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button id="plBtn" title="播放列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="21" height="21">
          <path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="17" r="2.2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 反馈面板 -->

<!-- 播放列表 -->
<div id="drawer"><div id="drawerIn">
  <div id="drawerHead">
    <div class="r1"><h3 id="plTitle">曲库</h3><button id="drawerClose">关闭</button></div>
    <div id="filters">
      <input id="fSearch" placeholder="搜索曲名/原唱">
      <select class="fSel" id="fLang"><option value="">语言</option></select>
      <select class="fSel" id="fDate"><option value="">日期</option></select>
    </div>
  </div>
  <div id="plist"></div>
</div></div>

<audio id="au" preload="none"></audio>
<script>
const SONGS = [];  /* 由 lib/build_site.py 注入 */

const $ = id => document.getElementById(id);
const au = $('au');
let cur=-1, lines=[], els=[], activeIdx=-1, follow=true, followDirty=false;
let lastT=0,lastWall=0,estT=0,dragging=false;
let mode = 'one';                 // one | all | shuffle

const fmt = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function smoothTime(){
  const t=au.currentTime,w=performance.now();
  if(!au.paused){ if(t!==lastT){lastT=t;lastWall=w;estT=t;} else estT=Math.min(t+(w-lastWall)/1000,t+0.35); }
  else { lastT=t; lastWall=w; estT=t; }
  return estT;
}

/* ---------- 播放列表 + 筛选 ---------- */
function fillSelects(){
  const langs=[...new Set(SONGS.map(s=>s.lang))].filter(Boolean);
  langs.forEach(v=> $('fLang').add(new Option(v, v)));
  const key=d=>{ const m=String(d).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    return m? Number(m[1])*10000+Number(m[2])*100+Number(m[3]) : 0; };
  const dates=[...new Set(SONGS.map(s=>s.date).filter(Boolean))].sort((a,b)=>key(b)-key(a));
  dates.forEach(v=> $('fDate').add(new Option(v, v)));
}

function updateListActive(){
  const box=$('plist'); if(!box) return;
  const items=box.querySelectorAll('.pi');
  items.forEach((el,k)=>{ el.classList.toggle('on', k===cur); });
}
function renderList(){
  const q=$('fSearch').value.trim().toLowerCase();
  const lg=$('fLang').value, dt=$('fDate').value;

  const box=$('plist'); box.innerHTML='';
  let n=0;
  SONGS.forEach((s,i)=>{
    if(s.legacy) return;
    if(lg && s.lang!==lg) return;
    if(dt && s.date!==dt) return;
    viewIdx.push(i);
    if(q){
      const norm=x=>String(x||'').toLowerCase().replace(/\s+/g,'');
      const hay=norm(s.title+s.artist);
      const ok=q.split(/\s+/).filter(Boolean).every(w=>hay.includes(norm(w)));
      if(!ok) return;
    }
    n++;
    const d=document.createElement('button');
    d.type='button';
    d.className='pi'+(i===cur?' on':'');
    d.setAttribute('aria-label', s.title+' 原唱 '+s.artist);
    d.innerHTML='<div class="n"></div><div class="m"><div class="t"></div><div class="a"></div></div><div class="d"></div>';
    d.querySelector('.n').textContent=i+1;
    d.querySelector('.t').textContent=s.title;
    d.querySelector('.a').textContent='原唱：'+s.artist+' · '+s.lang+(s.date?' · '+s.date:'')+(s.ver?' · '+s.ver:'');
    d.querySelector('.d').textContent=fmt(s.dur);
    d.onclick=()=>{ if(i===cur){ togglePlay(); } else { play(i); } };
    d.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation();
      if(i===cur){ togglePlay(); } else { play(i); } } };
    box.appendChild(d);
  });
  if(!n) box.innerHTML='<div id="pEmpty">没有符合条件的歌曲</div>';
  $('plTitle').textContent=`播放列表 · ${n} / ${SONGS.length}`;
}

/* ---------- 歌词 ---------- */
function parseLRC(txt){
  const out=[];
  (txt||'').split('\n').forEach(ln=>{
    const m=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text=ln.replace(/\[[^\]]*\]/g,'').trim();
    if(!m.length||!text)return;
    m.forEach(x=>out.push({t:+x[1]*60+parseFloat(x[2]),text}));
  });
  return out.sort((a,b)=>a.t-b.t);
}
function buildLyrics(s){
  const inner=$('lyrInner'); inner.innerHTML=''; els=[]; activeIdx=-1; followDirty=false;
  lines=parseLRC(s.lrc); $('lyrWrap').scrollTop=0;
  if(!lines.length){ inner.innerHTML='<div id="noLyr">暂无歌词</div>'; return; }
  // 同一时间点的多行歌词合并显示，避免只显示最后一行
  const merged=[];
  lines.forEach(l=>{
    const last=merged[merged.length-1];
    if(last && Math.abs(last.t-l.t)<0.06){ last.text=last.text+'　'+l.text; }
    else merged.push({t:l.t,text:l.text});
  });
  lines=merged;
  lines.forEach((l)=>{
    const d=document.createElement('div'); d.className='ln'; d.textContent=l.text;
    d.onclick=(ev)=>{ ev.stopPropagation();
      const t=Math.max(0,Math.min((au.duration||1e9),l.t));
      au.currentTime=t; if(!au.paused){ au.play().catch(()=>{}); }
      lastT=t; lastWall=performance.now(); estT=t;
    };
    inner.appendChild(d); els.push(d);
  });
  requestAnimationFrame(()=>centerOn(0,false));
}
function centerOn(i,smooth){
  if(i<0||!els[i])return;
  const w=$('lyrWrap'), el=els[i];
  const y=el.offsetTop-w.clientHeight/2+el.offsetHeight/2;
  if(smooth&&w.scrollTo) w.scrollTo({top:y,behavior:'smooth'}); else w.scrollTop=y;
  lastCenter=performance.now();
}

/* ---------- 主循环 ---------- */
function tick(){
  if(scrubbing){ const d0=au.duration||0, q=d0?au.currentTime/d0:0;
    $('pFill').style.width=(q*100)+'%'; $('pKnob').style.left=(q*100)+'%';
    $('pCur').textContent=fmt(au.currentTime);
    requestAnimationFrame(tick); return; }
  const t=smoothTime();
  let idx=-1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t<=t) idx=i; else break; }
  if(idx!==activeIdx){
    if(activeIdx>=0&&els[activeIdx]){
      els[activeIdx].classList.remove('active');
      if(activeIdx<idx) els[activeIdx].classList.add('done');
    }
    activeIdx=idx;
    if(idx>=0&&els[idx]){ els[idx].classList.remove('done'); els[idx].classList.add('active'); followDirty=true; }
  }
  if(follow&&followDirty){ centerOn(activeIdx,true); followDirty=false; }

  const d=au.duration||0, p=d?au.currentTime/d:0;
  $('pFill').style.width=(p*100)+'%'; $('pKnob').style.left=(p*100)+'%';
  $('pCur').textContent=fmt(au.currentTime);
  requestAnimationFrame(tick);
}

/* ---------- 切歌（随机/循环统一） ---------- */
let hist=[];
function viewList(){ return viewIdx.length ? viewIdx : SONGS.map((_,i)=>i); }
function nextSong(auto){
  const V=viewList();
  if(mode==='shuffle' && V.length>1){
    let n=cur; while(n===cur) n=V[Math.floor(Math.random()*V.length)];
    if(cur>=0) hist.push(cur);
    play(n); return;
  }
  const k=V.indexOf(cur);
  play(V[(k<0?0:k+1)%V.length]);
}
function prevSong(){
  const V=viewList();
  if(mode==='shuffle' && hist.length){
    const p=hist.pop();
    if(Number.isInteger(p) && p>=0 && p<SONGS.length){ play(p); return; }
  }
  const k=V.indexOf(cur);
  play(V[(k<=0?V.length-1:k-1)]);
}
/* ---------- 歌词状态重建（跳转后不残留旧高亮） ---------- */
function rebuildLyricState(){
  els.forEach(el=>{ el.classList.remove('active'); el.classList.remove('done'); });
  const t=au.currentTime; let idx=-1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t<=t) idx=i; else break; }
  for(let i=0;i<idx;i++) if(els[i]) els[i].classList.add('done');
  if(idx>=0&&els[idx]) els[idx].classList.add('active');
  activeIdx=idx;
  centerOn(idx,false);
}
/* ---------- 抽屉/弹窗开关（含焦点管理） ---------- */
function openDrawer(){ const d=$('drawer'); d.classList.add('show'); d.removeAttribute('inert');
  const on=document.querySelector('#plist .pi.on');
  if(on) on.scrollIntoView({block:'center'});
  else if($('plTitle')) $('plTitle').focus(); }
function closeDrawer(){ const d=$('drawer');
  const hadFocus = d.contains(document.activeElement);
  d.classList.remove('show'); d.setAttribute('inert','');
  if(hadFocus && $('plBtn')) $('plBtn').focus(); }

/* ---------- 播放 ---------- */
let curSrc=''; let playSeq=0;
function setStatus(txt,showRetry){
  const el=$('pStatus'); if(!el) return;
  if(!txt){ el.classList.remove('show'); el.innerHTML=''; }
  else {
    el.innerHTML = (showRetry
      ? '<div style="font-size:12px">'+txt+'</div>'
        +'<button id="pRetry" style="border:1px solid rgba(255,255,255,.4);background:transparent;'
        +'color:#fff;font-size:11.5px;border-radius:10px;padding:3px 12px;cursor:pointer;pointer-events:auto">点此重试</button>'
      : '<div class="ring"></div>' + (txt?'<div style="font-size:11.5px;opacity:.85">'+txt+'</div>':''));
    el.classList.add('show');
    if(showRetry){
      const rb=$('pRetry'); if(rb) rb.onclick=()=>{
        const pos=au.currentTime||0;
        if(cur>=0) play(cur);
        const onMeta=()=>{ try{ au.currentTime=pos; }catch(e){} au.removeEventListener('loadedmetadata',onMeta); };
        au.addEventListener('loadedmetadata',onMeta);
      };
    }
  }
  const box=$('lyrBox'); if(box) box.classList.toggle('waiting', !!txt);
}
function play(i){
  if(!Number.isInteger(i)||i<0||i>=SONGS.length) return;   // 非法索引直接忽略
  const seq=++playSeq;
  cur=i; const s=SONGS[i];
  const u='../audio/'+encodeURIComponent(s.file);
  curSrc=u;
  setStatus('加载中…',false);
  au.src=u; au.load();
  au.play().catch(err=>{
    if(seq!==playSeq) return;                            // 已被新的一次播放取代，忽略
    if(err && err.name==='NotAllowedError'){ setStatus('点击播放按钮开始',false); }
    else if(err && err.name!=='AbortError' && err.name!=='NotAllowedError'){ setStatus('加载失败，点此重试',true); }
    console.warn('Audio playback failed', err);
  });
  $('pTitle').textContent=s.title;
  $('mOrig').textContent='原唱：'+s.artist;
  $('mTime').textContent='演唱日期：'+s.date+(s.time?'（'+s.time+'）':'');
  $('pTot').textContent=fmt(s.dur);
  au.onloadedmetadata=()=>{ if(isFinite(au.duration)&&au.duration>0) $('pTot').textContent=fmt(au.duration); };
  updateListActive();
  buildLyrics(s); follow=true;
  if(window.matchMedia('(max-width:520px)').matches) closeDrawer();
}
function togglePlay(){
  if(cur<0){ setStatus('先选一首歌',false); setTimeout(()=>setStatus('',false),1200); openDrawer(); return; }
  if(!au.src){ play(cur<0?0:cur); return; }
  au.paused?au.play().catch(()=>{}):au.pause();
}
// 进度条拖动跳转（拖动期间冻结歌词跟随，避免 smooth 滚动互相打架）
var lastCenter=0;
var scrubbing=false, wasPlaying=false;
let viewIdx=[];           // 当前筛选后的索引序列
(function(){
  const seek=$('pSeek');
  if(!seek) return;
  const pos=(e)=>{ const r=seek.getBoundingClientRect();
    const cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
    const d=au.duration||0;
    return d? Math.max(0,Math.min(d,(cx-r.left)/r.width*d)) : 0; };
  const begin=(e)=>{ scrubbing=true; wasPlaying=!au.paused; seek.classList.add('drag');
    const t=pos(e); au.currentTime=t; lastT=t; lastWall=performance.now(); estT=t;
    if(e.cancelable) e.preventDefault(); };
  let rafId=0, pendingT=0;
  const move=(e)=>{ if(!scrubbing) return; pendingT=pos(e);
    lastT=pendingT; lastWall=performance.now(); estT=pendingT;
    if(!rafId) rafId=requestAnimationFrame(()=>{ rafId=0; try{ au.currentTime=pendingT; }catch(err){} });
    if(e.cancelable) e.preventDefault(); };
  const endDrag=()=>{ if(!scrubbing) return;
    scrubbing=false; seek.classList.remove('drag');
    followDirty=true; centerOn(activeIdx,false);
    if(wasPlaying) au.play().catch(()=>{}); };
  seek.addEventListener('pointerdown',begin);
  seek.addEventListener('touchstart',begin,{passive:false});
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('touchmove',move,{passive:false});
  ['pointerup','pointercancel','touchend','touchcancel'].forEach(k=>window.addEventListener(k,endDrag));
})();
$('pPlayBtn').onclick=togglePlay;
$('next').onclick=()=>nextSong();
$('prev').onclick=()=>prevSong();

/* ---------- 播放模式循环 ---------- */
const MODES=[
  {k:'one',   tip:'单曲循环'},
  {k:'all',   tip:'列表循环'},
  {k:'shuffle',tip:'随机播放'}
];
function applyMode(){
  const m=MODES.find(x=>x.k===mode);
  $('modeBtn').title='播放模式：'+m.tip;
  $('icoOne').style.display  = mode==='one'?'block':'none';
  $('icoAll').style.display  = mode==='all'?'block':'none';
  $('icoShuf').style.display = mode==='shuffle'?'block':'none';
  $('modeBtn').classList.toggle('on', mode!=='all');
}
$('modeBtn').onclick=()=>{
  const idx=MODES.findIndex(x=>x.k===mode);
  mode=MODES[(idx+1)%MODES.length].k;
  applyMode();
  const name={one:'单曲循环',all:'列表循环',shuffle:'随机播放'}[mode]||mode;
  setStatus('模式：'+name,false); setTimeout(()=>setStatus('',false),900);
};

/* ---------- 反馈 ---------- */
$('plBtn').onclick=openDrawer;
$('drawerClose').onclick=closeDrawer;
$('drawer').onclick=e=>{ if(e.target.id==='drawer') closeDrawer(); };




/* 歌词手动滚动 */
let mTimer=null, touchIdle=null;
function pauseFollow(){
  follow=false;
  clearTimeout(mTimer);
}
function scheduleSnapBack(){
  clearTimeout(touchIdle);
  touchIdle=setTimeout(()=>{          // 松手后 1.5 秒无操作 → 平滑回归当前行
    follow=true; followDirty=true;
  },1500);
}
['wheel'].forEach(k=>$('lyrWrap').addEventListener(k,()=>{ pauseFollow(); scheduleSnapBack(); },{passive:true}));
['touchstart','touchmove','pointerdown','pointermove'].forEach(k=>
  $('lyrWrap').addEventListener(k,(e)=>{
    if(k==='pointerdown'||k==='pointermove'){ if(window.matchMedia('(pointer:coarse)').matches===false) return; }
    pauseFollow(); scheduleSnapBack();
  },{passive:true}));
['touchend','touchcancel','pointerup','pointercancel'].forEach(k=>
  $('lyrWrap').addEventListener(k,()=>{ scheduleSnapBack(); },{passive:true}));

/* 音频事件 */
au.addEventListener('play',()=>{ $('iPlay').style.display='none'; $('iPause').style.display='block'; });
au.addEventListener('pause',()=>{ $('iPlay').style.display='block'; $('iPause').style.display='none'; });
au.addEventListener('ended',()=>{
  if(mode==='one'){ au.currentTime=0; au.play().catch(()=>{}); return; }
  nextSong(true);
});
au.addEventListener('seeked',()=>{ rebuildLyricState(); followDirty=true; });
au.addEventListener('waiting',()=>setStatus('缓冲中…',false));
au.addEventListener('playing',()=>setStatus('',false));
au.addEventListener('canplay',()=>setStatus('',false));
au.addEventListener('error',()=>setStatus('加载失败，点此重试',true));

/* 筛选事件 */
$('fSearch').oninput=renderList;
$('fSearch').addEventListener('pointerdown',e=>e.stopPropagation());
$('fSearch').addEventListener('click',e=>{ e.stopPropagation(); $('fSearch').focus(); });
$('fLang').onchange=renderList;
$('fDate').onchange=renderList;

function inEditable(t){
  if(!t) return false;
  const tag=(t.tagName||'').toLowerCase();
  return tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable===true;
}
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229) return;          // 输入法组合中
  const drawer=$('drawer');
  if(e.code==='Escape' && drawer.classList.contains('show')){ closeDrawer(); return; }
  if(drawer.classList.contains('show') && (e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='Enter')){
    const items=[...document.querySelectorAll('#plist .pi')];
    if(items.length){
      const idx=items.indexOf(document.activeElement);
      if(e.code==='Enter' && idx>=0){ e.preventDefault(); items[idx].click(); return; }
      if(e.code==='ArrowDown'||e.code==='ArrowUp'){
        e.preventDefault();
        let n=idx<0?0:idx+(e.code==='ArrowDown'?1:-1);
        n=Math.max(0,Math.min(items.length-1,n));
        items[n].focus(); items[n].scrollIntoView({block:'nearest'});
        return;
      }
    }
  }
  if(e.code==='Escape'){ closeDrawer(); return; }
  if(inEditable(e.target)) return;                    // 输入控件内不抢按键
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(e.code==='Space' && (tag==='button'||tag==='a'||e.target.closest&&e.target.closest('button,a'))) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); nextSong(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); prevSong(); }
});
window.addEventListener('resize',()=>{ if(activeIdx>=0) centerOn(activeIdx,false); });

closeDrawer();
fillSelects(); renderList(); applyMode();
requestAnimationFrame(tick);
</script></body></html>
